name: Build BioTwin Android App (APK & AAB for Play Store)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build Android Release AAB (for Google Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace || true

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BioTwin-Labs-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB to Artifacts (Google Play Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: BioTwin-Labs-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
