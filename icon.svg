<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0a1026" />
      <stop offset="100%" stop-color="#03050b" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Shield Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="105" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Background Cyber Circuit Grid Lines -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="2">
    <circle cx="256" cy="256" r="160" fill="none" stroke-dasharray="8 8" />
    <circle cx="256" cy="256" r="110" fill="none" />
    <line x1="96" y1="256" x2="416" y2="256" />
    <line x1="256" y1="96" x2="256" y2="416" />
  </g>

  <!-- Medical Authority Bio-Shield Outline -->
  <path d="M 256 80 L 370 125 C 370 260 256 360 256 385 C 256 360 142 260 142 125 Z"
        fill="rgba(10, 16, 38, 0.75)" stroke="url(#borderGrad)" stroke-width="8" stroke-linejoin="round" filter="url(#glow)" />

  <!-- DNA Twin Strands (Left & Right Spirals) -->
  <g fill="none" stroke-linecap="round">
    <!-- Helix 1 (Cyan) -->
    <path d="M 195 160 Q 230 200 256 220 T 317 280" stroke="#38bdf8" stroke-width="6" opacity="0.85" />
    <!-- Helix 2 (Violet) -->
    <path d="M 317 160 Q 282 200 256 220 T 195 280" stroke="#a855f7" stroke-width="6" opacity="0.85" />
  </g>

  <!-- ECG Cardiac Living Pulse Wave (Center Active Rhythm) -->
  <path d="M 155 240 L 205 240 L 220 215 L 240 270 L 260 170 L 285 290 L 305 240 L 355 240"
        fill="none" stroke="url(#pulseGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Twin Energy Nodes (Physical Human + Digital Twin) -->
  <!-- Left Node (Physical Body) -->
  <circle cx="205" cy="240" r="12" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="205" cy="240" r="6" fill="#ffffff" />

  <!-- Right Node (Digital Twin) -->
  <circle cx="305" cy="240" r="12" fill="#10b981" filter="url(#glow)" />
  <circle cx="305" cy="240" r="6" fill="#ffffff" />

  <!-- Central Apex Vitality Core -->
  <circle cx="256" cy="170" r="9" fill="#ffffff" filter="url(#glow)" />

  <!-- Brand Typography Arc at Base -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">
    BIOTWIN
  </text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="6">
    PRECISION LABS
  </text>
</svg>