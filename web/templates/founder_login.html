<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Founder Security Gate | BioTwin Labs</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070c;
            --surface: #0a0f1a;
            --surface-card: #111827;
            --border: #1f293d;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .gate-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }
        .shield-icon {
            width: 64px;
            height: 64px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px;
        }
        .pin-input {
            width: 100%;
            background: var(--surface-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            margin: 20px 0;
            transition: all 0.2s;
        }
        .pin-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4);
        }
        .error-msg {
            color: var(--danger);
            font-size: 12px;
            margin-top: 12px;
            font-weight: 700;
        }
        .security-badge {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="gate-card">
        <div class="shield-icon">🛡️</div>
        <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 6px;">Founder Security Access</h2>
        <p style="font-size: 12px; color: #94a3b8; line-height: 1.6;">
            BioTwin Leads & Payment Reconciliation Console is private and restricted to the founder only.
        </p>

        <form method="POST" action="/founder-login">
            <input type="password" name="pin" maxlength="6" class="pin-input" placeholder="••••" autofocus required>
            <button type="submit" class="btn-submit">Authenticate Master PIN →</button>
            {% if error %}
            <div class="error-msg">⚠️ {{ error }}</div>
            {% endif %}
        </form>

        <div class="security-badge">
            <span>🔒 Protected by 256-Bit SHA Session Authentication</span>
        </div>
        <div style="margin-top: 14px;">
            <a href="/" style="font-size: 12px; color: #94a3b8; text-decoration: none;">← Return to Customer Portal</a>
        </div>
    </div>

</body>
</html>
